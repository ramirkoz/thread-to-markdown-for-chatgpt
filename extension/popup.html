<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thread to Markdown</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header>
      <img src="icons/icon48.png" alt="" width="40" height="40">
      <div>
        <h1 data-i18n="popupHeading">Thread to Markdown</h1>
        <p data-i18n="popupTagline">Choose messages and export them locally.</p>
      </div>
    </header>

    <section class="privacy" aria-label="Privacy notice">
      <strong data-i18n="privacyTitle">Private by design</strong>
      <span data-i18n="privacyText">The page is processed only on your device. Nothing is sent to the developer.</span>
    </section>

    <section id="selection" class="selection" hidden>
      <div class="selection-head">
        <div>
          <strong id="thread-title"></strong>
          <span id="selection-count"></span>
        </div>
        <div class="selection-actions">
          <button id="select-all" class="text-button" type="button" data-i18n="selectAllButton">Select all</button>
          <button id="clear-all" class="text-button" type="button" data-i18n="clearAllButton">Clear</button>
        </div>
      </div>
      <div id="messages" class="messages" role="list"></div>

      <div class="output-row">
        <label for="format" data-i18n="formatLabel">Format</label>
        <select id="format">
          <option value="markdown" data-i18n="formatMarkdown">Markdown (.md)</option>
          <option value="text" data-i18n="formatText">Plain text (.txt)</option>
          <option value="json" data-i18n="formatJson">JSON (.json)</option>
        </select>
      </div>
    </section>

    <div class="action-row">
      <button id="copy" class="secondary" type="button" data-i18n="copySelectedButton" disabled>Copy selected</button>
      <button id="export" class="primary" type="button" data-i18n="exportButton" disabled>Export selected</button>
    </div>
    <p id="status" role="status" aria-live="polite" data-i18n="loadingStatus">Reading the open conversation…</p>

    <footer>
      <span data-i18n="unofficialNotice">Unofficial extension. Not affiliated with OpenAI.</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
