<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thread to Markdown</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header>
      <img src="icons/icon48.png" alt="" width="40" height="40">
      <div>
        <h1 data-i18n="popupHeading">Thread to Markdown</h1>
        <p data-i18n="popupTagline">Choose messages and export them locally.</p>
      </div>
    </header>

    <section class="privacy" aria-label="Privacy notice">
      <strong data-i18n="privacyTitle">Private by design</strong>
      <span data-i18n="privacyText">The page is processed only on your device. Nothing is sent to the developer.</span>
    </section>

    <section id="selection" class="selection" hidden>
      <div class="selection-head">
        <div>
          <strong id="thread-title"></strong>
          <span id="selection-count"></span>
        </div>
        <div class="selection-actions">
          <button id="select-all" class="text-button" type="button" data-i18n="selectAllButton">Select all</button>
          <button id="clear-all" class="text-button" type="button" data-i18n="clearAllButton">Clear</button>
        </div>
      </div>

      <div class="navigation-tools">
        <label class="search-field" for="message-search">
          <span data-i18n="searchMessagesLabel">Search messages</span>
          <input
            id="message-search"
            type="search"
            autocomplete="off"
            data-i18n-placeholder="searchMessagesPlaceholder"
            placeholder="Search by text or role"
          >
        </label>
        <div id="role-filter" class="role-filter" role="group">
          <button class="role-filter-button active" type="button" data-role-filter="all" data-i18n="roleFilterAll" aria-pressed="true">All</button>
          <button class="role-filter-button" type="button" data-role-filter="user" data-i18n="roleFilterUser" aria-pressed="false">User</button>
          <button class="role-filter-button" type="button" data-role-filter="assistant" data-i18n="roleFilterAssistant" aria-pressed="false">ChatGPT</button>
        </div>
        <div class="toc-summary">
          <strong data-i18n="tocHeading">Thread contents</strong>
          <span id="search-count"></span>
        </div>
        <div class="result-navigation" role="group">
          <button id="previous-search-result" class="result-nav-button" type="button" disabled>←</button>
          <span id="search-position" aria-live="polite">0 of 0</span>
          <button id="next-search-result" class="result-nav-button" type="button" disabled>→</button>
        </div>
      </div>

      <div id="messages" class="messages" role="list"></div>

      <div class="output-row">
        <label for="format" data-i18n="formatLabel">Format</label>
        <select id="format">
          <option value="markdown" data-i18n="formatMarkdown">Markdown (.md)</option>
          <option value="html" data-i18n="formatHtml">HTML (.html)</option>
          <option value="pdf" data-i18n="formatPdf">PDF (guided print)</option>
          <option value="text" data-i18n="formatText">Plain text (.txt)</option>
          <option value="json" data-i18n="formatJson">JSON (.json)</option>
        </select>
      </div>
    </section>

    <div class="action-row">
      <button id="copy" class="secondary" type="button" data-i18n="copySelectedButton" disabled>Copy selected</button>
      <button id="export" class="primary" type="button" data-i18n="exportButton" disabled>Export selected</button>
    </div>
    <p id="status" role="status" aria-live="polite" data-i18n="loadingStatus">Reading the open conversation…</p>

    <footer>
      <span data-i18n="unofficialNotice">Unofficial extension. Not affiliated with OpenAI.</span>
    </footer>
  </main>
  <script src="popup.js"></script>
  <script src="navigation-highlight-fix.js"></script>
  <script src="role-filter.js"></script>
  <script src="search-navigation.js"></script>
</body>
</html>
