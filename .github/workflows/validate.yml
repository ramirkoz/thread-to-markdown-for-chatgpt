name: Validate extension

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript and package
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            extension/background.js \
            extension/background-entry.js \
            extension/popup.js \
            extension/popup-router.js \
            extension/site-tools.js \
            extension/selected-text-handoff-background.js \
            extension/screenshot-handoff-background.js \
            extension/html-export.js \
            extension/language-export.js \
            extension/pdf-export.js \
            extension/package-export.js \
            extension/print.js; do
            node --check "$file"
          done

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('extension')
          manifest = json.loads((root / 'manifest.json').read_text())
          background = (root / 'background-entry.js').read_text()
          router = (root / 'popup-router.js').read_text()
          site_html = (root / 'site-tools.html').read_text()
          site_js = (root / 'site-tools.js').read_text()
          chat_html = (root / 'sidepanel.html').read_text()

          assert manifest['manifest_version'] == 3
          assert manifest['version'] == '1.9.0'
          assert manifest['permissions'] == ['activeTab', 'scripting', 'downloads']
          assert manifest['optional_host_permissions'] == ['https://chatgpt.com/*']
          assert 'host_permissions' not in manifest
          assert manifest['background']['service_worker'] == 'background-entry.js'
          assert manifest['action']['default_popup'] == 'sidepanel.html'

          required = [
              'background.js', 'background-entry.js', 'popup.js', 'popup.css',
              'sidepanel.html', 'sidepanel.css', 'site-tools.html', 'site-tools.css',
              'site-tools.js', 'popup-router.js', 'html-export.js', 'language-export.js',
              'pdf-export.js', 'package-export.js', 'print.html', 'print.css', 'print.js',
              'selected-text-handoff-background.js', 'screenshot-handoff-background.js',
              'icons/icon16.png', 'icons/icon32.png', 'icons/icon48.png', 'icons/icon128.png'
          ]
          for name in required:
              assert (root / name).is_file(), name

          for marker in ('id="message-search"', 'id="prompt-library"', 'id="export"'):
              assert marker in chat_html, marker
          for marker in ('send-selection', 'send-page', 'send-screenshot', 'send-youtube'):
              assert marker in site_html, marker

          assert "importScripts('popup-router.js')" in background
          assert "importScripts('selected-text-handoff-background.js')" in background
          assert "importScripts('screenshot-handoff-background.js')" in background
          assert "importScripts('context-menu-handoff.js')" not in background
          assert "importScripts('toolbar-sidepanel-fix.js')" not in background

          for marker in ('chrome.action.setPopup', "CHATGPT_POPUP = 'sidepanel.html'", "SITE_POPUP = 'site-tools.html'"):
              assert marker in router, marker
          for marker in ('chrome.permissions.request', 'chrome.scripting.executeScript', 'captureVisibleTab', "type: 'insert-selected-text'", "type: 'insert-screenshot'"):
              assert marker in site_js, marker

          print('Extension validation: PASS')
          PY

          rm -f /tmp/thread-to-markdown.zip
          (cd extension && zip -qr /tmp/thread-to-markdown.zip .)
          unzip -t /tmp/thread-to-markdown.zip
          unzip -Z1 /tmp/thread-to-markdown.zip | grep -qx 'manifest.json'
          unzip -Z1 /tmp/thread-to-markdown.zip | grep -qx 'sidepanel.html'
          unzip -Z1 /tmp/thread-to-markdown.zip | grep -qx 'site-tools.html'
          unzip -Z1 /tmp/thread-to-markdown.zip | grep -qx 'popup-router.js'

      - name: Build development packages
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")"
          ROOT="thread-to-markdown-for-chatgpt-${VERSION}"

          rm -rf dist source-package
          mkdir -p dist "source-package/${ROOT}"
          (cd extension && zip -9 -qr "../dist/${ROOT}-chrome-package.zip" .)
          cp -R extension "source-package/${ROOT}/"
          cp README.md PRIVACY.md CHANGELOG.md RELEASE_NOTES.md STORE_LISTING.md STORE_SUBMISSION_CHECKLIST.md LICENSE "source-package/${ROOT}/"
          (cd source-package && zip -9 -qr "../dist/${ROOT}-source.zip" "${ROOT}")
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)

      - name: Upload development build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: thread-to-markdown-for-chatgpt-development-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
