name: Validate extension

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript and package
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            extension/background.js \
            extension/background-entry.js \
            extension/popup.js \
            extension/popup-router.js \
            extension/site-tools.js \
            extension/thread-workspace.js \
            extension/workspace-bulk-export.js \
            extension/selected-text-handoff-background.js \
            extension/screenshot-handoff-background.js \
            extension/html-export.js \
            extension/language-export.js \
            extension/pdf-export.js \
            extension/package-export.js \
            extension/print.js; do
            node --check "$file"
          done

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('extension')
          manifest = json.loads((root / 'manifest.json').read_text())
          background = (root / 'background-entry.js').read_text()
          router = (root / 'popup-router.js').read_text()
          entry_html = (root / 'popup-entry.html').read_text()
          site_html = (root / 'site-tools.html').read_text()
          site_js = (root / 'site-tools.js').read_text()
          chat_html = (root / 'sidepanel.html').read_text()
          workspace_js = (root / 'thread-workspace.js').read_text()
          bulk_js = (root / 'workspace-bulk-export.js').read_text()

          assert manifest['manifest_version'] == 3
          assert manifest['name'] == 'ChatExtra Toolkit'
          assert manifest['version'] == '2.0.0'
          assert manifest['permissions'] == ['activeTab', 'scripting', 'downloads']
          assert manifest['optional_host_permissions'] == ['https://chatgpt.com/*']
          assert 'host_permissions' not in manifest
          assert manifest['background']['service_worker'] == 'background-entry.js'
          assert manifest['action']['default_popup'] == 'popup-entry.html'

          required = [
              'background.js', 'background-entry.js', 'popup.js', 'popup.css',
              'popup-entry.html', 'popup-router.js', 'sidepanel.html', 'sidepanel.css',
              'site-tools.html', 'site-tools.css', 'site-tools.js',
              'thread-workspace.js', 'thread-workspace.css', 'workspace-bulk-export.js',
              'html-export.js', 'language-export.js', 'pdf-export.js', 'package-export.js',
              'print.html', 'print.css', 'print.js', 'selected-text-handoff-background.js',
              'screenshot-handoff-background.js', 'icons/icon16.png', 'icons/icon32.png',
              'icons/icon48.png', 'icons/icon128.png'
          ]
          for name in required:
              assert (root / name).is_file(), name

          assert 'src="popup-router.js"' in entry_html
          for marker in ('id="message-search"', 'id="prompt-library"', 'id="thread-workspace"', 'id="workspace-save-current"', 'id="workspace-export-selected"', 'id="workspace-backup"', 'id="export"'):
              assert marker in chat_html, marker
          assert chat_html.index('id="export"') < chat_html.index('id="prompt-library"')
          assert chat_html.index('id="export"') < chat_html.index('id="thread-workspace"')
          for marker in ('send-selection', 'send-page', 'send-screenshot', 'send-youtube'):
              assert marker in site_html, marker

          assert "importScripts('popup-router.js')" not in background
          assert "importScripts('workspace-bulk-export.js')" in background
          assert "importScripts('selected-text-handoff-background.js')" in background
          assert "importScripts('screenshot-handoff-background.js')" in background

          for marker in ("CHATGPT_POPUP = 'sidepanel.html'", "SITE_POPUP = 'site-tools.html'", 'chrome.tabs.query', 'location.replace'):
              assert marker in router, marker
          assert 'chrome.action.setPopup' not in router
          for marker in ('chrome.permissions.request', 'chrome.scripting.executeScript', 'captureVisibleTab', "type: 'insert-selected-text'", "type: 'insert-screenshot'"):
              assert marker in site_js, marker
          for marker in ('indexedDB.open', 'workspace-bulk-export', 'thread-to-markdown-local-backup', 'prepare-thread', 'folder', 'tags', 'note'):
              assert marker in workspace_js, marker
          for marker in ('createStoredZip', 'library.json', 'chats/', 'MAX_TOTAL_BYTES'):
              assert marker in bulk_js, marker

          print('Extension validation: PASS')
          PY

          rm -f /tmp/chatextra-toolkit.zip
          (cd extension && zip -qr /tmp/chatextra-toolkit.zip .)
          unzip -t /tmp/chatextra-toolkit.zip
          unzip -Z1 /tmp/chatextra-toolkit.zip | grep -qx 'manifest.json'
          unzip -Z1 /tmp/chatextra-toolkit.zip | grep -qx 'popup-entry.html'
          unzip -Z1 /tmp/chatextra-toolkit.zip | grep -qx 'sidepanel.html'
          unzip -Z1 /tmp/chatextra-toolkit.zip | grep -qx 'site-tools.html'
          unzip -Z1 /tmp/chatextra-toolkit.zip | grep -qx 'thread-workspace.js'
          unzip -Z1 /tmp/chatextra-toolkit.zip | grep -qx 'workspace-bulk-export.js'

      - name: Build development packages
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")"
          ROOT="ChatExtra-Toolkit-${VERSION}"

          rm -rf dist source-package
          mkdir -p dist "source-package/${ROOT}"
          (cd extension && zip -9 -qr "../dist/${ROOT}-chrome-package.zip" .)
          cp -R extension "source-package/${ROOT}/"
          cp README.md PRIVACY.md CHANGELOG.md RELEASE_NOTES.md STORE_LISTING.md STORE_SUBMISSION_CHECKLIST.md LICENSE "source-package/${ROOT}/"
          test -f USER_MANUAL_UK.md && cp USER_MANUAL_UK.md "source-package/${ROOT}/"
          (cd source-package && zip -9 -qr "../dist/${ROOT}-source.zip" "${ROOT}")
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)

      - name: Upload development build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: chatextra-toolkit-development-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
