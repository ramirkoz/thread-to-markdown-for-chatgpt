name: Validate extension

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript and package
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/background.js
          node --check extension/background-entry.js
          node --check extension/html-export.js
          node --check extension/popup.js

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('extension')
          manifest = json.loads((root / 'manifest.json').read_text())

          assert manifest['manifest_version'] == 3
          assert re.fullmatch(r'\d+\.\d+\.\d+', manifest['version'])
          assert manifest['permissions'] == ['activeTab', 'scripting', 'downloads']
          assert 'host_permissions' not in manifest
          assert manifest['background']['service_worker'] == 'background-entry.js'

          required = [
              root / 'background.js',
              root / 'background-entry.js',
              root / 'html-export.js',
              root / 'popup.html',
              root / 'popup.css',
              root / 'popup.js',
              root / 'icons/icon16.png',
              root / 'icons/icon32.png',
              root / 'icons/icon48.png',
              root / 'icons/icon128.png',
          ]
          for path in required:
              assert path.is_file(), path

          html = (root / 'popup.html').read_text()
          js = (root / 'popup.js').read_text()
          html_export = (root / 'html-export.js').read_text()
          assert 'value="html"' in html
          assert "'html'" in js
          assert "format: 'html'" in html_export
          assert "mimeType: 'text/html'" in html_export

          keys = set(re.findall(r'data-i18n="([^"]+)"', html))
          keys.update(re.findall(r"getMessage\('([^']+)'", js))

          for locale in ('en', 'uk'):
              messages_path = root / '_locales' / locale / 'messages.json'
              messages = json.loads(messages_path.read_text())
              missing = sorted(keys - messages.keys())
              assert not missing, f'{locale} missing translations: {missing}'

          print('Extension validation: PASS')
          PY

          rm -f /tmp/thread-to-markdown.zip
          (cd extension && zip -qr /tmp/thread-to-markdown.zip .)
          unzip -Z1 /tmp/thread-to-markdown.zip | grep -qx 'manifest.json'

      - name: Build development packages
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")"
          ROOT="thread-to-markdown-for-chatgpt-${VERSION}"

          rm -rf dist source-package
          mkdir -p dist "source-package/${ROOT}"

          (cd extension && zip -9 -qr "../dist/${ROOT}-chrome-package.zip" .)

          cp -R extension "source-package/${ROOT}/"
          cp README.md PRIVACY.md CHANGELOG.md RELEASE_NOTES.md STORE_LISTING.md STORE_SUBMISSION_CHECKLIST.md LICENSE "source-package/${ROOT}/"
          (cd source-package && zip -9 -qr "../dist/${ROOT}-source.zip" "${ROOT}")

          unzip -Z1 "dist/${ROOT}-chrome-package.zip" | grep -qx 'manifest.json'
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)

      - name: Upload development build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: thread-to-markdown-for-chatgpt-development-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
