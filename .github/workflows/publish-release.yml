name: Publish extension release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          node --check extension/background.js
          node --check extension/background-entry.js
          node --check extension/popup.js
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('extension/manifest.json').read_text())
          assert manifest['manifest_version'] == 3
          assert manifest['permissions'] == ['activeTab', 'scripting', 'downloads']
          assert 'host_permissions' not in manifest
          assert manifest['background']['service_worker'] == 'background-entry.js'

          for path in [
              'extension/background.js',
              'extension/background-entry.js',
              'extension/popup.html',
              'extension/popup.css',
              'extension/popup.js',
              'extension/icons/icon128.png',
              'extension/_locales/en/messages.json',
              'extension/_locales/uk/messages.json',
          ]:
              assert Path(path).is_file(), path

          print('Release validation: PASS')
          PY

      - name: Build release packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")"
          ROOT="thread-to-markdown-for-chatgpt-${VERSION}"

          rm -rf dist source-package
          mkdir -p dist "source-package/${ROOT}"

          (cd extension && zip -9 -qr "../dist/${ROOT}-chrome-web-store.zip" .)

          cp -R extension "source-package/${ROOT}/"
          cp README.md PRIVACY.md CHANGELOG.md RELEASE_NOTES.md STORE_LISTING.md STORE_SUBMISSION_CHECKLIST.md LICENSE "source-package/${ROOT}/"
          (cd source-package && zip -9 -qr "../dist/${ROOT}-source.zip" "${ROOT}")

          unzip -Z1 "dist/${ROOT}-chrome-web-store.zip" | grep -qx 'manifest.json'
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")"
          ROOT="thread-to-markdown-for-chatgpt-${VERSION}"
          TAG="${GITHUB_REF_NAME}"
          TITLE="Thread to Markdown for ChatGPT ${VERSION}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create "${TAG}" --title "${TITLE}" --notes-file RELEASE_NOTES.md --latest
          fi

          gh release upload "${TAG}" "dist/${ROOT}-chrome-web-store.zip" --clobber
          gh release upload "${TAG}" "dist/${ROOT}-source.zip" --clobber
          gh release upload "${TAG}" dist/SHA256SUMS.txt --clobber
