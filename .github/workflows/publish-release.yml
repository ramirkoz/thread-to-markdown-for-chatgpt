name: Publish extension release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore extension icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extension/icons
          echo 'iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAY0lEQVR4nGMUSzX5z0ABYKJEMwMDAwMLMuflrNNEaRJPM8U04OWs0ygS+ACyWoJeIOQqisNg4A1gwSaI7m9kPnpAY3UBrtjAJo7TC+iKcRlK20CE2YovgTEiZyZykjLjgOdGAPBlHPZbuBCKAAAAAElFTkSuQmCC' | base64 -d > extension/icons/icon16.png
          echo '' | base64 -d > extension/icons/icon32.png
          echo '' | base64 -d > extension/icons/icon48.png
          echo '' | base64 -d > extension/icons/icon128.png

          if ! git ls-files --error-unmatch extension/icons/icon128.png >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add extension/icons
            git commit -m 'Add extension icons'
            git push origin HEAD:main
          fi

      - name: Validate extension
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('extension/manifest.json').read_text())
          assert manifest['manifest_version'] == 3
          assert manifest['version'] == '1.4.0'
          assert manifest['permissions'] == ['activeTab', 'scripting', 'downloads']
          for path in [
              'extension/background.js', 'extension/popup.html',
              'extension/popup.css', 'extension/popup.js',
              'extension/icons/icon128.png',
              'extension/_locales/en/messages.json',
              'extension/_locales/uk/messages.json']:
              assert Path(path).is_file(), path
          print('Extension validation: PASS')
          PY

      - name: Build release packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist source-package
          mkdir -p dist source-package/thread-to-markdown-for-chatgpt-1.4.0

          (cd extension && zip -9 -qr ../dist/thread-to-markdown-for-chatgpt-1.4.0-chrome-web-store.zip .)

          cp -R extension source-package/thread-to-markdown-for-chatgpt-1.4.0/
          cp README.md PRIVACY.md CHANGELOG.md RELEASE_NOTES.md STORE_LISTING.md STORE_SUBMISSION_CHECKLIST.md LICENSE source-package/thread-to-markdown-for-chatgpt-1.4.0/
          (cd source-package && zip -9 -qr ../dist/thread-to-markdown-for-chatgpt-1.4.0-source.zip thread-to-markdown-for-chatgpt-1.4.0)

          (cd dist && sha256sum *.zip > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v1.4.0'
          TITLE='Thread to Markdown for ChatGPT 1.4.0'

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "$TITLE"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md --latest
          fi

          gh release upload "$TAG" dist/thread-to-markdown-for-chatgpt-1.4.0-chrome-web-store.zip --clobber
          gh release upload "$TAG" dist/thread-to-markdown-for-chatgpt-1.4.0-source.zip --clobber
          gh release upload "$TAG" dist/SHA256SUMS.txt --clobber
