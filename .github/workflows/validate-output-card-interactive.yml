name: Validate output card interactive control

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate icon-only generated file control binding
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/attachment-output-card-interactive-fix.js

          python - <<'PY'
          from pathlib import Path

          module = Path('extension/attachment-output-card-interactive-fix.js').read_text()
          entry = Path('extension/background-entry.js').read_text()

          assert 'annotateAssistantOutputCardsWithInteractiveControl' in module
          assert '[tabindex]:not([tabindex="-1"])' in module
          assert '[class*="cursor-pointer"]' in module
          assert 'data-thread-export-exact-proxy' in module
          assert 'data-thread-export-download-button' in module
          assert 'Download file' in module
          assert 'document.createTreeWalker(root, 4)' in module
          assert "importScripts('attachment-output-card-interactive-fix.js')" in entry
          assert entry.index("importScripts('attachment-output-card-button-fix.js')") < entry.index(
              "importScripts('attachment-output-card-interactive-fix.js')"
          )

          print('Icon-only generated file control binding: PASS')
          PY
