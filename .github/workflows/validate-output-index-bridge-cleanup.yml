name: Validate output index bridge cleanup

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate clean generated-file bridges
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/attachment-output-index-bridge-cleanup.js

          python - <<'PY'
          from pathlib import Path

          module = Path('extension/attachment-output-index-bridge-cleanup.js').read_text()
          entry = Path('extension/background-entry.js').read_text()

          assert "document.createElement('span')" in module
          assert "data-thread-export-index-bridge" in module
          assert "bridge.setAttribute('data-href', '')" in module
          assert "document.createElement('button')" not in module
          assert "importScripts('attachment-output-index-bridge-cleanup.js')" in entry
          assert entry.index("importScripts('attachment-output-card-geometric-bridge.js')") < entry.index(
              "importScripts('attachment-output-index-bridge-cleanup.js')"
          )

          print('Clean generated-file bridges: PASS')
          PY
