name: Temporary encrypted RC51 release bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_tmp_rc51_release_bridge.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download encrypted RC51 payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 'https://specializing-rod-consolidation-bread.trycloudflare.com/rc51.zip.enc' -o rc51.zip.enc
          test -s rc51.zip.enc
          sha256sum rc51.zip.enc
      - name: Publish temporary public encrypted release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v2.1.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v2.1.0 rc51.zip.enc --title 'Temporary RC51 encrypted transfer' --notes 'Temporary encrypted transfer payload.'
