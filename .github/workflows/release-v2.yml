name: Publish ChatExtra Toolkit v2.0.1

on:
  workflow_run:
    workflows:
      - Validate extension
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('extension/manifest.json').read_text())
          background = Path('extension/background-entry.js').read_text()
          safe_zip = Path('extension/zip-safe-hotfix.js').read_text()
          assert manifest['name'] == 'ChatExtra Toolkit'
          assert manifest['version'] == '2.0.1'
          assert manifest['permissions'] == ['activeTab', 'scripting', 'downloads']
          assert manifest['action']['default_popup'] == 'popup-entry.html'
          assert "importScripts('zip-safe-hotfix.js')" in background
          for marker in ('target.click(', '.click()', 'window.open', 'chrome.tabs.create', 'collectActivatedAttachmentCards', 'collectMainWorldAttachmentCards'):
              assert marker not in safe_zip, marker
          PY

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="2.0.1"
          ROOT="ChatExtra-Toolkit-${VERSION}"
          rm -rf release-dist source-package drive-bundle
          mkdir -p release-dist "source-package/${ROOT}" "drive-bundle/${ROOT}"

          (cd extension && zip -9 -qr "../release-dist/${ROOT}-chrome-package.zip" .)

          cp -R extension "source-package/${ROOT}/"
          cp README.md PRIVACY.md CHANGELOG.md RELEASE_NOTES.md STORE_LISTING.md STORE_SUBMISSION_CHECKLIST.md USER_MANUAL_UK.md LICENSE "source-package/${ROOT}/"
          (cd source-package && zip -9 -qr "../release-dist/${ROOT}-source.zip" "${ROOT}")

          (cd release-dist && sha256sum *.zip > SHA256SUMS.txt)

          cp release-dist/${ROOT}-chrome-package.zip "drive-bundle/${ROOT}/"
          cp release-dist/${ROOT}-source.zip "drive-bundle/${ROOT}/"
          cp release-dist/SHA256SUMS.txt "drive-bundle/${ROOT}/"
          cp README.md PRIVACY.md CHANGELOG.md RELEASE_NOTES.md STORE_LISTING.md STORE_SUBMISSION_CHECKLIST.md USER_MANUAL_UK.md "drive-bundle/${ROOT}/"
          (cd drive-bundle && zip -9 -qr "../release-dist/${ROOT}-Google-Drive-bundle.zip" "${ROOT}")
          (cd release-dist && sha256sum ${ROOT}-Google-Drive-bundle.zip >> SHA256SUMS.txt)

          unzip -t "release-dist/${ROOT}-chrome-package.zip"
          unzip -t "release-dist/${ROOT}-source.zip"
          unzip -t "release-dist/${ROOT}-Google-Drive-bundle.zip"
          unzip -Z1 "release-dist/${ROOT}-chrome-package.zip" | grep -qx 'zip-safe-hotfix.js'

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2.0.1
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            release-dist/ChatExtra-Toolkit-2.0.1-chrome-package.zip \
            release-dist/ChatExtra-Toolkit-2.0.1-source.zip \
            release-dist/ChatExtra-Toolkit-2.0.1-Google-Drive-bundle.zip \
            release-dist/SHA256SUMS.txt \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "ChatExtra Toolkit 2.0.1" \
            --notes-file RELEASE_NOTES.md

      - name: Upload release synchronization bundle
        uses: actions/upload-artifact@v4
        with:
          name: ChatExtra-Toolkit-2.0.1-release-sync
          path: release-dist/
          if-no-files-found: error
          retention-days: 30
