name: Validate attachment resource fallback

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate attachment resource fallback
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/attachment-resource-fallback.js
          grep -q "importScripts('attachment-resource-fallback.js')" extension/background-entry.js
          grep -q "isPlausibleAttachmentUrl" extension/attachment-resource-fallback.js
          grep -q "generatedUrlsForFileIds" extension/attachment-resource-fallback.js
          grep -q "candidateMap" extension/attachment-resource-fallback.js
          grep -q "performance.getEntriesByType" extension/attachment-resource-fallback.js
          grep -q "backend-api/estuary/content?id=" extension/attachment-resource-fallback.js
          grep -q "page or decorative asset instead of the attachment bytes" extension/attachment-resource-fallback.js
          grep -q "No attachment endpoint returned valid bytes" extension/attachment-resource-fallback.js
