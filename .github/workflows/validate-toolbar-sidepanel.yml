name: Validate ChatGPT toolbar popup

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate ChatGPT toolbar popup
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('extension')
          manifest = json.loads((root / 'manifest.json').read_text())
          html = (root / 'sidepanel.html').read_text()
          css = (root / 'sidepanel.css').read_text()

          assert manifest['version'] == '1.9.0'
          assert manifest['permissions'] == ['activeTab', 'scripting', 'downloads', 'contextMenus']
          assert 'sidePanel' not in manifest['permissions']
          assert 'side_panel' not in manifest
          assert manifest['action']['default_popup'] == 'sidepanel.html'
          assert 'id="message-search"' in html
          assert 'id="prompt-library"' in html
          assert 'id="export"' in html
          assert 'width: 620px' in css
          assert 'min-height: 560px' in css

          print('ChatGPT toolbar popup validation: PASS')
          PY
