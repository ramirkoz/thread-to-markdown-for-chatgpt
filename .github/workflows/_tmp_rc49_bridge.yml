name: Temporary encrypted RC49 bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_tmp_rc49_bridge.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download encrypted payload from temporary public release
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/ramirkoz/thread-to-markdown-for-chatgpt/releases/download/v2.0.0/kontur-rc49-transfer.enc' -o "$RUNNER_TEMP/kontur-rc49-transfer.enc"
          test -s "$RUNNER_TEMP/kontur-rc49-transfer.enc"
          sha256sum "$RUNNER_TEMP/kontur-rc49-transfer.enc"
      - name: Upload encrypted workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rc49-drive-bridge
          path: ${{ runner.temp }}/kontur-rc49-transfer.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Publish artifact pointer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="rc49-drive-bridge") | .id' | head -n1 || true)"
            if [ -n "$artifact_id" ]; then break; fi
            sleep 2
          done
          test -n "$artifact_id"
          printf 'run_id=%s\nartifact_id=%s\n' "$GITHUB_RUN_ID" "$artifact_id" > _tmp_rc49_artifact_pointer.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _tmp_rc49_artifact_pointer.txt
          git commit -m 'tmp: publish RC49 artifact pointer'
          git push
