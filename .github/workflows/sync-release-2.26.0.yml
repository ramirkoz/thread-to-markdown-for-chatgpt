name: Finalize extension repository cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-release-2.26.0.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove completed temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/_tmp_rc49_bridge.yml \
            .github/workflows/_tmp_rc51_public_bridge.yml \
            .github/workflows/_tmp_rc51_release_bridge.yml \
            .github/workflows/sync-release-2.26.0.yml
          git commit -m 'chore: remove completed temporary extension workflows'
          git push origin HEAD:main
