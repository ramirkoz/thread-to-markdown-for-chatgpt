name: Sync and release GPT Project & Memory Tools 2.32.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-release-2.26.0.yml'

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact tested 2.32.1 artifacts from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release-staging/GPT-Project-Memory-Tools-2.32.1.zip.b64 > /tmp/GPT-Project-Memory-Tools-2.32.1.zip
          base64 -d .release-staging/GPT-Project-Memory-Tools-2.32.1-source.zip.b64 > /tmp/GPT-Project-Memory-Tools-2.32.1-source.zip
          cp .release-staging/GPT-Project-Memory-Tools-2.32.1-LOCAL-TEST-REPORT.md /tmp/GPT-Project-Memory-Tools-2.32.1-LOCAL-TEST-REPORT.md
          cp .release-staging/SHA256SUMS.txt /tmp/SHA256SUMS.txt

          echo 'bea09068c8197b53640344cdfd108fa38fcc76267445a344296edd5b14422b17  /tmp/GPT-Project-Memory-Tools-2.32.1.zip' | sha256sum -c -
          echo 'fcff23a977b23e1e98746289360c35abe689ca61297a77181d7ebb70a1afb892  /tmp/GPT-Project-Memory-Tools-2.32.1-source.zip' | sha256sum -c -
          echo 'bf3a99e2cf8e605e4c6010654dc53d552f25cea1a126cadef7fc68d4b45e9129  /tmp/GPT-Project-Memory-Tools-2.32.1-LOCAL-TEST-REPORT.md' | sha256sum -c -
          unzip -t /tmp/GPT-Project-Memory-Tools-2.32.1.zip
          unzip -t /tmp/GPT-Project-Memory-Tools-2.32.1-source.zip

      - name: Synchronize repository source from tested source package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/source-2321
          mkdir -p /tmp/source-2321
          unzip -q /tmp/GPT-Project-Memory-Tools-2.32.1-source.zip -d /tmp/source-2321
          MANIFEST="$(find /tmp/source-2321 -type f -path '*/extension/manifest.json' -print -quit)"
          test -n "$MANIFEST"
          SRC="$(dirname "$MANIFEST")"
          rm -rf extension
          cp -a "$SRC" extension
          cp extension/CHANGELOG.md CHANGELOG.md
          mkdir -p docs
          cp /tmp/GPT-Project-Memory-Tools-2.32.1-LOCAL-TEST-REPORT.md docs/GPT-Project-Memory-Tools-2.32.1-LOCAL-TEST-REPORT.md

      - name: Validate synchronized source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('extension/manifest.json').read_text(encoding='utf-8'))
          assert manifest['manifest_version'] == 3
          assert manifest['name'] == 'GPT Project & Memory Tools'
          assert manifest['version'] == '2.32.1'
          assert manifest['permissions'] == ['activeTab', 'scripting', 'downloads', 'storage']
          assert manifest['optional_host_permissions'] == ['https://chatgpt.com/*', 'https://chat.openai.com/*']
          print('2.32.1 manifest validation: PASS')
          PY
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count+1))
          done < <(find extension -type f -name '*.js' -print0)
          test "$count" -eq 49
          echo "JavaScript syntax: 49/49 PASS"

      - name: Commit exact tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A extension CHANGELOG.md docs/GPT-Project-Memory-Tools-2.32.1-LOCAL-TEST-REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m 'release: synchronize GPT Project & Memory Tools 2.32.1'
            git push origin HEAD:main
          fi

      - name: Publish exact GitHub release v2.32.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/RELEASE_NOTES.md <<'EOF'
          # GPT Project & Memory Tools 2.32.1

          Current tested Chrome Web Store release.

          - Manifest version 2.32.1 PASS.
          - JavaScript syntax 49/49 PASS.
          - Chrome package and source ZIP integrity PASS.
          - Mixed-attachment control export 9/9 PASS.
          - Large MP4 and PPTX capture PASS.
          - Content deduplication PASS.
          - No developer telemetry or remotely hosted executable code.
          EOF
          if gh release view v2.32.1 >/dev/null 2>&1; then
            gh release edit v2.32.1 --title 'GPT Project & Memory Tools 2.32.1' --notes-file /tmp/RELEASE_NOTES.md --latest
          else
            gh release create v2.32.1 --target main --title 'GPT Project & Memory Tools 2.32.1' --notes-file /tmp/RELEASE_NOTES.md --latest
          fi
          gh release upload v2.32.1 /tmp/GPT-Project-Memory-Tools-2.32.1.zip /tmp/GPT-Project-Memory-Tools-2.32.1-source.zip /tmp/GPT-Project-Memory-Tools-2.32.1-LOCAL-TEST-REPORT.md /tmp/SHA256SUMS.txt --clobber


      - name: Remove completed temporary release and bridge workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/_tmp_rc49_bridge.yml \
            .github/workflows/_tmp_rc51_public_bridge.yml \
            .github/workflows/_tmp_rc51_release_bridge.yml \
            .github/workflows/sync-release-2.26.0.yml
          git commit -m 'chore: remove completed temporary release workflows'
          git push origin HEAD:main
